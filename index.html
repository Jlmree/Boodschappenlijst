async function flush(){

/* ---------- Supabase-adapter (zelfde vorm als de eerdere opslag) ---------- */
function makeSupa(H){
  const sb=supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{global:{headers:{"x-household":H}},auth:{persistSession:false,autoRefreshToken:false}});
  const colls={},subs={};let live=false;
  const E=e=>{const x=new Error((e&&e.message)||"fout");const net=!e||!e.code||/fetch|network|timeout/i.test(e.message||"");x.code=net?"unavailable":"invalid_argument";return x};
  const snap=c=>{const md={fromCache:false,hasPendingWrites:false};const arr=Object.entries(colls[c]||{});return{docs:arr.map(([id,d])=>({id,exists:true,data:()=>d,metadata:md})),size:arr.length,metadata:md}};
  const emit=c=>(subs[c]||[]).forEach(f=>{try{f(snap(c))}catch(e){}});
  async function fetchColl(c){const{data,error}=await sb.from("docs").select("id,data").eq("household",H).eq("coll",c);if(error)throw E(error);colls[c]=Object.fromEntries(data.map(r=>[r.id,r.data]));emit(c)}
  const pend={};
  function fetchDoc(c,id){clearTimeout(pend[c+id]);pend[c+id]=setTimeout(async()=>{try{const{data,error}=await sb.from("docs").select("id,data").eq("household",H).eq("coll",c).eq("id",id);if(error)return;colls[c]=colls[c]||{};if(data&&data[0])colls[c][id]=data[0].data;else delete colls[c][id];emit(c)}catch(e){}},120)}
  async function refetchAll(){for(const c in subs){try{await fetchColl(c)}catch(e){}}}
  const ch=sb.channel("gezin-"+H,{config:{broadcast:{self:false}}});
  ch.on("broadcast",{event:"doc"},({payload})=>{if(!payload||typeof payload.c!=="string"||typeof payload.id!=="string")return;const{c,id,data}=payload;if(payload.r){fetchDoc(c,id);return}colls[c]=colls[c]||{};if(data==null)delete colls[c][id];else if(typeof data==="object")colls[c][id]=data;emit(c)})
    .subscribe(st=>{const was=live;live=st==="SUBSCRIBED";if(live&&!was)refetchAll()});
  const send=(c,id,data)=>{try{ch.send({type:"broadcast",event:"doc",payload:{c,id,data}})}catch(e){}};
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refetchAll()});
  addEventListener("online",refetchAll);
  return{
    doc(path){const[c,id]=path.split("/");return{
      async set(d){let r;try{r=await sb.from("docs").upsert({household:H,coll:c,id,data:d,updated_at:new Date().toISOString()})}catch(e){throw E(e)}if(r.error)throw E(r.error);(colls[c]=colls[c]||{})[id]=d;send(c,id,d)},
      async update(p){let r;try{r=await sb.rpc("merge_doc",{p_coll:c,p_id:id,p_patch:p})}catch(e){throw E(e)}if(r.error)throw E(r.error);if(r.data){(colls[c]=colls[c]||{})[id]=r.data;emit(c);try{ch.send({type:"broadcast",event:"doc",payload:{c,id,r:1}})}catch(e){}fetchDoc(c,id)}},
      async delete(){let r;try{r=await sb.from("docs").delete().eq("household",H).eq("coll",c).eq("id",id)}catch(e){throw E(e)}if(r.error)throw E(r.error);if(colls[c])delete colls[c][id];send(c,id,null)}
    }},
    collection(c){return{onSnapshot(next){(subs[c]=subs[c]||[]).push(next);fetchColl(c).catch(()=>{});return()=>{}}}}
  };
}

}

    if(!isNaN(a)&&!isNaN(b)&&/^\d*[.,]?\d*$/.test(nq.replace(",","."))&&/^\d*[.,]?\d*$/.test(qty.replace(",",".")))nq=String(a+b);

function morph(a,b){
  const ac=[...a.childNodes],bc=[...b.childNodes];
  for(let k=0;k<bc.length;k++){
    const x=ac[k],y=bc[k];
    if(!x){a.appendChild(y);continue}
    if(x.isEqualNode(y))continue;
    if(x.nodeType===1&&y.nodeType===1&&x.nodeName===y.nodeName&&(x.dataset.key||"")===(y.dataset.key||"")&&x.nodeName!=="IMG"){
      for(const at of [...x.attributes])if(!y.hasAttribute(at.name))x.removeAttribute(at.name);
      for(const at of [...y.attributes])if(x.getAttribute(at.name)!==at.value)x.setAttribute(at.name,at.value);
      morph(x,y);
    }else if(x.nodeType===3&&y.nodeType===3){x.nodeValue=y.nodeValue}
    else a.replaceChild(y,x);
  }
  for(let k=ac.length-1;k>=bc.length;k--)if(ac[k].parentNode===a)a.removeChild(ac[k]);
}

  const l=L();if(!l)return newListSheet();const st=l.staples||[];
  const onList=new Set(Object.values(S.items).filter(i=>i.list===cur&&!i.done).map(i=>norm(i.name)));
  openSheet('<h3>Vaste items</h3><p style="margin:0;color:var(--mut);font-size:15px">Tik aan wat op is en zet het in één keer op de lijst.</p><div class="cols" style="margin-top:14px" id="stc">'+(st.length?st.map((s,j)=>'<button class="chip'+(onList.has(norm(s.n))?'':' on')+'" data-act="stt" data-j="'+j+'" aria-pressed="'+!onList.has(norm(s.n))+'"'+(onList.has(norm(s.n))?' disabled style="opacity:.45"':'')+'>'+h(s.n)+'</button>').join(""):'<span style="color:var(--mut)">Nog geen vaste items.</span>')+'</div><label for="stN">Vast item toevoegen</label><div class="form"><input type="text" id="stN" placeholder="bijv. melk"><button class="go" data-act="addst" aria-label="Vast item toevoegen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div><div class="btns"><button class="btn sec" data-act="close">Sluiten</button><button class="btn" data-act="addstaples">Zet op lijst</button></div><p class="note">Tip: in een item kun je ook "Vast item op deze lijst" aanvinken.</p>');
}
function shareLink(){return location.origin+location.pathname+"#gezin="+H}
function shareSheet(){
  const nm=LS.get("bs_name","");
  if(!HASDB){openSheet('<h3>Delen met je gezin</h3><div class="opt"><b>Nog niet gekoppeld</b><p>Om te delen moet de app eenmalig aan een gratis Supabase-database worden gekoppeld. De stappen staan in de README van de repo.</p></div><div class="btns"><button class="btn" data-act="close">Begrepen</button></div>');return}
  if(!H){openSheet('<h3>Samen met je gezin</h3><p style="margin:0;color:var(--mut)">Start een nieuw gezin en stuur de link door, of vul de code in die je hebt gekregen.</p><div class="btns"><button class="btn" data-act="newhh">Nieuw gezin starten</button></div><label for="hc">Of: code of link van je gezin</label><div class="form"><input type="text" id="hc" placeholder="bijv. k3m9q2x7p4ab" autocapitalize="off"><button class="go" data-act="joinhh" aria-label="Koppelen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div><p class="note" id="hcErr"></p>');return}
  openSheet('<h3>Delen met je gezin</h3><p style="margin:0 0 8px;color:var(--mut)">Iedereen met deze link kan meedoen, zonder account. Deel hem alleen met je gezin.</p><input type="text" id="shl" readonly value="'+h(shareLink())+'"><div class="btns"><button class="btn" data-act="sharelink">Deel link</button><button class="btn sec" data-act="copylink">Kopieer</button></div><p class="note">Gezinscode: <b>'+h(H)+'</b></p><label for="myName">Jouw naam</label><div class="form"><input type="text" id="myName" value="'+h(nm)+'" placeholder="bijv. Anna"><button class="go" data-act="savename" aria-label="Naam opslaan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div><div class="opt"><b>Op je beginscherm</b><p>Android (Chrome): menu ⋮, dan App installeren of Toevoegen aan startscherm. iPhone (Safari): deelknop, dan Zet op beginscherm.</p></div><div class="btns"><button class="btn del" data-act="leavehh" id="lv">Ander gezin kiezen</button></div>');
}
function nameSheet(){openSheet('<h3>Hoe heet je?</h3><p style="margin:0;color:var(--mut)">Zo ziet je gezin wie iets op de lijst zette of haalde.</p><label for="myName">Naam</label><input type="text" id="myName" placeholder="bijv. Anna" autocomplete="given-name"><div class="btns"><button class="btn" data-act="savename">Opslaan</button></div>');setTimeout(()=>$("#myName")&&$("#myName").focus(),50)}
function startHH(code){H=code;LS.set("bs_h",H);S={lists:{},items:{},known:{},pings:{},members:{}};Q=[];cur=null;saveCache();LS.set("bs_cur",null);location.reload()}

/* ---------- toast ---------- */
let toastT=null;
function toast(msg){$("#toastMsg").textContent=msg;$("#toast").classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>$("#toast").classList.remove("show"),2500)}

/* ---------- foto ---------- */
$("#file").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;const img=new Image();const url=URL.createObjectURL(f);
  img.onload=()=>{const m=480,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);pendingPhoto=c.toDataURL("image/jpeg",.7);URL.revokeObjectURL(url);const ph=$("#ePh");if(ph){ph.innerHTML='<img class="photo" alt="Productfoto">';ph.firstChild.src=pendingPhoto}};
  img.src=url;e.target.value="";
});

/* ---------- events ---------- */
$("#form").addEventListener("submit",e=>{
  e.preventDefault();const v=$("#inp").value;if(!v.trim())return;
  v.split(/,|\n|\s+en\s+/i).map(s=>s.trim()).filter(Boolean).forEach(s=>addItem(s));
  $("#inp").value="";suggest();
});
$("#inp").addEventListener("input",suggest);
$("#inp").addEventListener("focus",suggest);
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){$("#mic").hidden=false}
$("#mic").addEventListener("click",()=>{
  if(!SR)return;
  if(listening&&dict){dict.stop();return}
  dict=new SR();dict.lang="nl-NL";dict.interimResults=true;dict.continuous=false;
  dict.onstart=()=>{listening=true;$("#mic").classList.add("live");$("#inp").placeholder="Luisteren…"};
  dict.onend=()=>{listening=false;$("#mic").classList.remove("live");$("#inp").placeholder="Bijv. 2 melk, brood"};
  dict.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){$("#mic").hidden=true;toast("Microfoon niet toegestaan")}};
  dict.onresult=e=>{let fin="",tmp="";for(let k=e.resultIndex;k<e.results.length;k++){const t=e.results[k][0].transcript;if(e.results[k].isFinal)fin+=t;else tmp+=t}
    if(tmp)$("#inp").placeholder=tmp;
    if(fin){const v=$("#inp").value;$("#inp").value=(v?v+", ":"")+fin.trim();suggest()}};
  try{dict.start()}catch(e){}
});
let lpT=null,lpEl=null,lpX=0,lpY=0,lpFired=false;
let swEl=null,swRow=null,swX=0,swY=0,swDx=0,swOn=false,swRedraw=false,swFired=false;
function swEnd(commit){
  const row=swRow,rin=swEl;swEl=null;swRow=null;swOn=false;
  if(!row){return}
  row.classList.remove("swiping");
  if(commit){const id=row.dataset.id,i=S.items[id];rin.style.transform="translateX(-100%)";row.style.maxHeight=row.offsetHeight+"px";row.offsetHeight;row.classList.add("gone");
    setTimeout(()=>{if(i){del("items/"+id);toast(i.name+" verwijderd")}if(swRedraw){swRedraw=false}render()},330)}
  else{rin.style.transform="";if(swRedraw){swRedraw=false;setTimeout(render,220)}}
}
function lpCancel(){clearTimeout(lpT);lpT=null;if(lpEl)lpEl.classList.remove("press");lpEl=null}
document.addEventListener("pointerdown",e=>{
  lpFired=false;const t=e.target.closest(".txt[data-act=tog]");if(!t||e.button>0)return;
  lpCancel();lpFired=false;lpEl=t;lpX=e.clientX;lpY=e.clientY;
  setTimeout(()=>{if(lpEl===t)t.classList.add("press")},180);
  lpT=setTimeout(()=>{const id=t.dataset.id;lpCancel();lpFired=true;try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}editSheet(id)},500);
});
document.addEventListener("pointerdown",e=>{
  swFired=false;const rin=e.target.closest(".row .rin");if(!rin||e.button>0||e.target.closest(".step,.one"))return;
  swEl=rin;swRow=rin.parentNode;swX=e.clientX;swY=e.clientY;swDx=0;swOn=false;
},true);
document.addEventListener("pointermove",e=>{
  if(lpEl&&Math.hypot(e.clientX-lpX,e.clientY-lpY)>10)lpCancel();
  if(!swEl)return;const dx=e.clientX-swX,dy=e.clientY-swY;
  if(!swOn){if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){swEl=null;swRow=null;return}if(dx<-12&&Math.abs(dx)>Math.abs(dy)*1.3){swOn=true;lpCancel();swRow.classList.add("swiping")}else return}
  swDx=Math.min(0,dx);swEl.style.transform="translateX("+swDx+"px)";e.preventDefault();
},{passive:false});
document.addEventListener("pointerup",()=>{if(!swEl)return;if(swOn){swFired=true;swEnd(swDx<-Math.min(140,swRow.offsetWidth*.38))}else{swEl=null;swRow=null}},true);
document.addEventListener("pointercancel",()=>{if(swEl){if(swOn)swEnd(false);else{swEl=null;swRow=null}}},true);
["pointerup","pointercancel","scroll"].forEach(ev=>document.addEventListener(ev,lpCancel,true));
document.addEventListener("contextmenu",e=>{if(e.target.closest(".txt[data-act=tog]"))e.preventDefault()});
document.addEventListener("keydown",e=>{const t=e.target.closest&&e.target.closest(".txt[data-act=tog]");if(t&&e.key==="Enter"&&e.shiftKey){e.preventDefault();editSheet(t.dataset.id)}});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  if(b.dataset.act==="tog"&&(lpFired||swFired)){lpFired=false;swFired=false;e.preventDefault();return}const a=b.dataset.act,id=b.dataset.id;
  if(a==="tog")toggle(id);
  else if(a==="plus")step(id,1);
  else if(a==="minus")step(id,-1);
  else if(a==="edit")editSheet(id);
  else if(a==="list"){cur=id;LS.set("bs_cur",cur);render()}
  else if(a==="newlist")newListSheet();
  else if(a==="settings")settingsSheet();
  else if(a==="share")shareSheet();
  else if(a==="staples")staplesSheet();
  else if(a==="close")closeSheet();
  else if(a==="sugg"){const parts=$("#inp").value.split(",");parts.pop();parts.forEach(s=>s.trim()&&addItem(s));addItem(b.dataset.n);$("#inp").value="";suggest()}
  else if(a==="col"){b.parentNode.querySelectorAll(".sw").forEach(x=>x.setAttribute("aria-pressed",x===b))}
  else if(a==="createlist"){const n=$("#lN").value.trim();if(!n){$("#lN").focus();return}const c=($("#lCol .sw[aria-pressed=true]")||{}).dataset?.c||COLORS[0];const nid=rid();const max=Math.max(0,...lists().map(x=>x.order||0));put("lists/"+nid,{name:n,color:c,order:max+1,cats:[...CATS],staples:[],createdAt:Date.now()});cur=nid;LS.set("bs_cur",cur);closeSheet();render()}
  else if(a==="up"||a==="down"){const j=+b.dataset.j,k=a==="up"?j-1:j+1;if(k<0||k>=tmpOrder.length)return;[tmpOrder[j],tmpOrder[k]]=[tmpOrder[k],tmpOrder[j]];$("#ord").innerHTML=ordHTML(tmpOrder)}
  else if(a==="rmcat"){if(tmpOrder.length<=1)return;tmpOrder.splice(+b.dataset.j,1);$("#ord").innerHTML=ordHTML(tmpOrder)}
  else if(a==="addcat"){const n=$("#newCat").value.trim().replace(/\s+/g," ").slice(0,30);if(!n){$("#newCat").focus();return}if(!tmpOrder.some(c=>c.toLowerCase()===n.toLowerCase()))tmpOrder.push(n.charAt(0).toUpperCase()+n.slice(1));$("#newCat").value="";$("#ord").innerHTML=ordHTML(tmpOrder);$("#ord").lastElementChild.scrollIntoView({block:"nearest"})}
  else if(a==="savelist"){const l=L();const c=($("#sheet .sw[aria-pressed=true]")||{}).dataset?.c||l.color;const d={...l,name:$("#sN").value.trim()||l.name,color:c,cats:tmpOrder};if(JSON.stringify(d)!==JSON.stringify(l))put("lists/"+cur,d);closeSheet()}
  else if(a==="dellist"){if(!confirmDel){confirmDel=true;b.textContent="Tik nogmaals: alles wissen";return}const lid=cur,l={...L()};const its=Object.entries(S.items).filter(([,i])=>i.list===lid);its.forEach(([iid])=>del("items/"+iid));del("lists/"+lid);closeSheet();toast("Lijst "+l.name+" verwijderd")}
  else if(a==="saveitem")saveItem();
  else if(a==="delitem"){const i={...S.items[editId]},iid=editId;del("items/"+iid);closeSheet();toast(i.name+" verwijderd")}
  else if(a==="photo")$("#file").click();
  else if(a==="nophoto"){pendingPhoto=null;$("#ePh").innerHTML=""}
  else if(a==="showdone"){showDone=!showDone;LS.set("bs_showdone",showDone);render()}
  else if(a==="cleardone"){const its=Object.entries(S.items).filter(([,i])=>i.list===cur&&i.done);its.forEach(([iid])=>del("items/"+iid));toast(its.length+" afgevinkte items gewist")}
  else if(a==="shop"){const p=S.pings.now;const mine=p&&p.active&&p.by===me&&Date.now()-p.at<3*3600e3;put("pings/now",{by:me,at:Date.now(),list:cur,active:!mine});
    if(mine){const lid=(p.list&&S.lists[p.list])?p.list:cur;const its=Object.entries(S.items).filter(([,i])=>i.list===lid&&i.done);its.forEach(([iid])=>del("items/"+iid));toast(its.length?"Klaar! "+its.length+" gehaalde artikel"+(its.length>1?"en":"")+" opgeruimd":"Klaar met winkelen");return}
    toast(mine?"Fijn, alles binnen!":"Je gezin ziet nu dat je in de winkel bent")}
  else if(a==="stt"){const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);b.classList.toggle("on",on)}
  else if(a==="addst"){const n=$("#stN").value.trim();if(!n)return;const l=L();const {name}=parse(n);if(!(l.staples||[]).some(s=>norm(s.n)===norm(name)))put("lists/"+cur,{...l,staples:[...(l.staples||[]),{n:name,c:guessCat(name)}]});staplesSheet()}
  else if(a==="newhh")startHH(newCode());
  else if(a==="joinhh"){const v=$("#hc").value.trim().toLowerCase();const m=v.match(/gezin=([a-z0-9]{8,32})/)||v.match(/^([a-z0-9]{8,32})$/);if(!m){$("#hcErr").textContent="Dat lijkt geen geldige code of link.";return}startHH(m[1])}
  else if(a==="sharelink"){const url=shareLink();if(navigator.share)navigator.share({title:"Onze boodschappenlijst",text:"Doe mee met onze gedeelde boodschappenlijst:",url}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(url).then(()=>toast("Link gekopieerd")).catch(()=>{$("#shl").select()})}}
  else if(a==="copylink"){const url=shareLink();(navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast("Link gekopieerd")).catch(()=>{const i=$("#shl");i.select();try{document.execCommand("copy");toast("Link gekopieerd")}catch(e){}})}
  else if(a==="savename"){const n=$("#myName").value.trim().slice(0,30);if(!n){$("#myName").focus();return}LS.set("bs_name",n);if(mode==="db")put("members/"+me,{name:n,at:Date.now()});closeSheet();toast("Hoi "+n+"!")}
  else if(a==="leavehh"){if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Zeker? Tik nogmaals";return}LS.set("bs_h",null);H=null;try{localStorage.removeItem("bs_cache");localStorage.removeItem("bs_queue");localStorage.removeItem("bs_cur")}catch(e){}location.reload()}
  else if(a==="addstaples"){const l=L();const sel=[...document.querySelectorAll("#stc .chip[aria-pressed=true]")].map(x=>(l.staples||[])[+x.dataset.j]).filter(Boolean);sel.forEach(s=>addItem(s.n,{cat:s.c}));closeSheet();if(sel.length)toast(sel.length+" vaste items op de lijst")}
});
addEventListener("online",()=>{flush();status()});addEventListener("offline",()=>status());

/* ---------- start ---------- */
render();
if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
(function start(){
  if(!HASDB||!H){status();if(HASDB&&!H)setTimeout(shareSheet,300);return}
  if(!LS.get("bs_dbmode",false)){LS.set("bs_dbmode",true)}
  mode="db";
  if(!window.supabase||!supabase.createClient){status("Offline, wijzigingen wachten");addEventListener("online",()=>location.reload(),{once:true});return}
  try{db=makeSupa(H)}catch(e){status("Kan database niet starten");return}
  status();subscribe();flush();
  const nm=LS.get("bs_name","");
  if(!nm)setTimeout(nameSheet,400);else if(!S.members[me]||S.members[me].name!==nm)put("members/"+me,{name:nm,at:Date.now()});
})();
}
